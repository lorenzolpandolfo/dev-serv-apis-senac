<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Loja</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body class="container mt-4">
    <h1>Categorias</h1>

    <form action="" id="formCategoria" class="mb-4">
      <input type="hidden" id="idCat" />

      <div class="input-group flex-nowrap">
        <span class="input-group-text"> Nome: </span>

        <input
          type="text"
          class="form-control"
          id="txtNome"
          placeholder="Digite o nome da categoria"
        />

        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>

    <table class="table table-striped table-hover" id="tbDados">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody id="listaCategorias"></tbody>
    </table>

    <hr class="my-5" />

    <h1>Produtos</h1>

    <form action="" id="formProduto" class="mb-4">
      <input type="hidden" id="idProd" />

      <div class="mb-3">
        <label for="txtNomeProd" class="form-label"> Nome do produto </label>

        <input
          type="text"
          class="form-control"
          id="txtNomeProd"
          placeholder="Digite o nome do produto"
        />
      </div>

      <div class="mb-3">
        <label for="txtPreco" class="form-label"> Preço </label>

        <input
          type="number"
          step="0.01"
          class="form-control"
          id="txtPreco"
          placeholder="Digite o preço"
        />
      </div>

      <div class="mb-3">
        <label for="selectCategoria" class="form-label"> Categoria </label>

        <select class="form-select" id="selectCategoria">
          <option value="">Selecione uma categoria</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary">Salvar produto</button>
    </form>

    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Preço</th>
          <th>Categoria</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody id="listaProdutos"></tbody>
    </table>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCgjlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="js/script.js"></script>
  </body>
</html>
